name: publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # the GitHub release and the version commit back to main
  id-token: write   # npm trusted publishing / provenance

# One publish at a time: two tags pushed together must not race on the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tag is the release decision, so it must name a version; the file on
      # main is allowed to lag and is corrected by the sync-version job below.
      - name: Resolve the release version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>"; exit 1; }
          echo "RELEASE_VERSION=$TAG" >> "$GITHUB_ENV"

      # This package has no build step, so a syntax pass is the whole preflight.
      - name: Check sources
        run: |
          node --check client.js
          node -e "import('./index.js').then(m => { if (m.name !== 'dsh-backlog.md') throw new Error('unexpected plugin name'); console.log('index.js ok:', m.name) })"

      # Stamp the tag's version into the runner's copy: what is published must
      # never disagree with the tag, whatever main currently says.
      - name: Stamp the version from the tag
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node -p "require('./package.json').version"

      - name: Show the tarball contents
        run: npm pack --dry-run

      # Trusted publishing: npm exchanges this job's OIDC token for a one-shot
      # publish credential, so the repository holds no npm secret. The package's
      # trusted publisher is kuwork/DSH-Backlog.md + this filename, and the job
      # needs `id-token: write` above. npm >= 11.5.1 is required, hence the pin.
      - name: Pin npm for trusted publishing
        run: |
          npm install -g npm@11.21.0
          npm --version

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  # Mirror the published version back onto main, which may have been tagged
  # before its package.json caught up. Runs only after a successful publish.
  sync-version:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Commit the version back to main
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version > /dev/null
          if git diff --quiet package.json; then
            echo "package.json already at $TAG; nothing to sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: sync package.json version to $GITHUB_REF_NAME [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
