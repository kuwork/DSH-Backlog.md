name: publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # the GitHub release step
  id-token: write   # npm provenance / trusted publishing

# One publish at a time: two tags pushed together must not race on the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A tag is the release decision; the version inside it must agree, or the
      # npm publish would land a version nobody asked for.
      - name: Check tag against package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      # This package has no build step, so a syntax pass is the whole preflight.
      - name: Check sources
        run: |
          node --check client.js
          node -e "import('./index.js').then(m => { if (m.name !== 'dsh-backlog.md') throw new Error('unexpected plugin name'); console.log('index.js ok:', m.name) })"

      - name: Show the tarball contents
        run: npm pack --dry-run

      # Token-based publishing. To switch to npm trusted publishing instead,
      # configure the package's trusted publisher on npmjs.com, delete the env
      # block below, and keep `--provenance`.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
